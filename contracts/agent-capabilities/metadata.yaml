  - name: learning.plan.get
    description: "Returns one owned learning plan by id: goal id, title, start and end dates, status and version."
    when_to_use:
      - "The user asks about one specific plan's window or status."
      - "You already hold a plan id (for example from learning.plans.list) and need its authoritative fields."
    when_not_to_use:
      - "To retrieve the plan's tasks — the response contains no task list; use learning.tasks.list."
      - "To retrieve plan history or versions — no version history is returned."
    error_contract:
      - "ResourceNotFoundException stating that the study plan does not exist when the id is unknown or belongs to another caller (ownership is enforced in the query, so a foreign id is indistinguishable from a missing one)."
    cost_hint:
      local: true
      external_dependency: null
      notes: "本次调用只做 JVM 内校验与数据库读写，没有外部依赖。"
    exposure:
      state: allowed
      reason: "Read-only ownership-checked lookup; a foreign plan id yields not-found rather than data."
    authoritative_facts:
      - fact: id
        meaning: "The plan actually returned, confirming the requested plan id resolved."
      - fact: goalId
        meaning: "The goal this plan serves."
      - fact: startDate
        meaning: "First day of the plan window."
      - fact: endDate
        meaning: "Last day of the plan window; together with startDate it bounds every task."
    examples:
