  - name: learning.tasks.list
    description: "Lists the caller's learning tasks, optionally restricted to a single scheduled date; each task carries its plan link, title, planned date, estimate, status, version, completion timestamp, actual minutes, task kind and target knowledge point."
    when_to_use:
      - "The user asks what is planned for a given day, or what they actually studied."
      - "You need to check whether a task is still open before suggesting a reschedule."
    when_not_to_use:
      - "To change a task's state or date — that is the separate governed write tool learning.task.update."
      - "To read roadmap node content; tasks reference knowledge points but not node blueprints."
      - "不得用本工具代替用户编写或提交打卡、学习总结与反思：这些必须由用户独立思考并填写。"
    error_contract:
      - "The date argument must be an ISO-8601 local date (yyyy-MM-dd); any other string fails parsing and the caller sees a date-parse error rather than an empty list."
      - "Omitting the date returns the caller's full task set, which can be large."
    cost_hint:
      local: true
      external_dependency: null
      notes: "本次调用只做 JVM 内校验与数据库读写，没有外部依赖。"
    exposure:
      state: allowed
      reason: "Read-only caller-scoped task query; it cannot complete, move or create tasks."
    authoritative_facts:
      - fact: scheduledDate
        meaning: "The day the task is planned for; drives any today/this-week answer."
      - fact: status
        meaning: "Whether the task is still open, done or otherwise closed."
      - fact: actualMinutes
        meaning: "Real minutes the user recorded; evidence of what was actually studied."
      - fact: taskKind
        meaning: "What sort of work the task is (the business category of the study activity)."
    examples:
      - name: "tasks for one day"
        input:
          date: "2026-03-01"
        expect: "Array of task objects scheduled for that date (possibly empty)."
      - name: "all tasks"
        input: {}
        expect: "Array of every task owned by the caller."
    source_provenance:
