      handler: "LearningTaskService.list — bean learningTasksTool calls service.list with the injected caller identity and a date parsed from the optional date argument (null when absent)"
      output_schema: backend/src/main/java/com/moxiao/studypilot/agent/tool/AgentToolOutputSchemas.java
    confirmation:
      mode: none
      waiting_status: null
      notes: "只读/导航工具无业务副作用，不产生确认状态；只有写工具经治理链路进入 WAITING_CONFIRMATION 或 WAITING_AUTHORIZATION。"
  - name: roadmap.current.get
    description: "Returns the caller's active enrolled roadmap as a compact agent projection: enrollment id, roadmap code, template version, title, required-node completion counters, and stages whose nodes expose only id, code, title and display status. The result is null when the user has not enrolled in any roadmap."
    when_to_use:
      - "The user asks where they are in the roadmap, which stages remain, or what to study next."
      - "You need route progress counters before proposing the next node."
    when_not_to_use:
      - "To read node learning content (objectives, high-frequency points, difficulty, prerequisites) — the projection omits them; use roadmap.node.get."
      - "To enumerate full stage or module trees — use roadmap.stage.get or roadmap.module.get."
    error_contract:
      - "Returns JSON null when no active enrollment exists; null is the documented not-enrolled answer and must not be reported as a failure."
      - "This is the only read tool whose declared success payload is nullable, so callers must null-check before reading the stages array."
    cost_hint:
      local: true
      external_dependency: null
      notes: "本次调用只做 JVM 内校验与数据库读写，没有外部依赖。"
    exposure:
      state: allowed
      reason: "Read-only caller-scoped projection of that caller's own enrollment; it can never enroll, upgrade or otherwise change the roadmap."
    authoritative_facts:
      - fact: roadmapCode
        meaning: "Which published roadmap the user is enrolled in."
      - fact: completedRequiredNodes
        meaning: "How many required nodes are finished; the core progress number."
      - fact: totalRequiredNodes
        meaning: "The denominator of progress; required nodes in the enrolled template."
      - fact: stages
        meaning: "Ordered stage list with their nodes, used to pick the next node to study."
    examples:
      - name: "current roadmap"
        input: {}
        expect: "Compact roadmap object, or null when the user has not enrolled."
    source_provenance:
      registration: backend/src/main/java/com/moxiao/studypilot/agent/tool/AgentReadToolConfiguration.java#L90-L95
      handler: "RoadmapQueryService.currentMapIfPresent — bean roadmapCurrentTool maps the Optional through AgentRoadmapMapResponse::from, or else null"
      output_schema: backend/src/main/java/com/moxiao/studypilot/agent/tool/AgentToolOutputSchemas.java
    confirmation:
      mode: none
      waiting_status: null
      notes: "只读/导航工具无业务副作用，不产生确认状态；只有写工具经治理链路进入 WAITING_CONFIRMATION 或 WAITING_AUTHORIZATION。"
  - name: roadmap.stage.get
    description: "Returns one stage of the caller's active roadmap, matched against the enrolled template: stage fields, module summaries and the full node list with per-node statuses and prerequisite codes."
    when_to_use:
      - "The user asks about a specific stage's composition or progress."
      - "You need the module and node inventory inside a stage before drilling into a node."
    when_not_to_use:
      - "When the user has no active enrollment; check roadmap.current.get first, because this tool fails instead of returning null."
      - "As a generic stage catalogue — ids from another roadmap template are rejected."
    error_contract:
      - "ResourceNotFoundException when the caller has no active enrollment (当前路线不存在)."
      - "ResourceNotFoundException when the stage id is not part of the enrolled template, so a stage id copied from elsewhere fails rather than silently returning nothing."
    cost_hint:
      local: true
      external_dependency: null
      notes: "本次调用只做 JVM 内校验与数据库读写，没有外部依赖。"
    exposure:
      state: allowed
      reason: "Read-only query restricted to the caller's enrolled template; it exposes no other user's roadmap and writes nothing."
    authoritative_facts:
      - fact: id
        meaning: "The stage actually resolved, confirming the requested stage id was valid for this enrollment."
      - fact: completedRequiredNodes
        meaning: "Finished required nodes within this stage."
      - fact: modules
        meaning: "Module summaries inside the stage, used to choose the next module."
      - fact: nodes
        meaning: "Full node list with statuses and prerequisites, used to pick or explain the next node."
    examples:
      - name: "one stage"
        input:
          stageId: "<stage-id from roadmap.current.get>"
        expect: "Stage object with module summaries and full nodes, or not-found if the id is not in the enrolled template."
    source_provenance:
