# H02 能力语义元数据（StudyPilot Agent Capability Manifest 的语义输入）
#
# Owner: DeepSeek Harness（H02 分包）。公共 Schema 与编译产物归 MiniMax；本文件是语义输入，不是生成产物。
#
# 唯一事实来源：Java AgentToolDescriptor 与 AgentToolOutputSchemas（name/version/category/
# effect/riskLevel/requiredScope/idempotency/timeout/input_schema/output_schema）。
# 本文件只补充用途语义，不重复也不覆盖上述事实；因此不出现 effect / riskLevel / scope /
# input_schema / output_schema / idempotency / timeoutMillis / version / category 等键。
#
# 格式：受限 YAML 子集（缩进映射、序列、流式 {}/[]、引号/纯量、注释）。JSON 文档亦为合法
# YAML 子集，可被同样的解析器读取。不使用锚点、别名或多文档。
#
# exposure 是 Manifest 层的治理判定，不是运行开关：catalog() 当前无过滤地返回全部 65 个工具。
#   allowed  = 满足后续权限与实现条件时可进入候选目录（不等于当前开通运行）
#   disabled = 按 H02 shared 边界禁用（21 个写工具未到 H11；coding/runner/本地自动化默认禁用）
#   pending  = 已注册但当前无法满足其声明契约（见各项 exposure.reason 中的 D1-D4 缺陷证据）
#
# confirmation 取自 AgentGovernanceService.createNewExecution 的真实规则：
#   riskLevel HIGH -> WAITING_CONFIRMATION；LOW 且无有效 scope 授权 -> WAITING_AUTHORIZATION；
#   LOW 且有授权 -> PENDING（立即执行）。只读/导航工具不产生确认状态。
#
# source_provenance.output_schema 是**指向** Java 契约文件的路径，不是 schema 副本。
#
# 全部内容为离线静态盘点；未运行服务、模型或数据库。证据与限制见
# docs/verification/harness/h02-deepseek.md。
tools:
  - name: governance.health.get
    description: "Returns the caller's own assistant health summary aggregated from stored agent execution rows and model usage rows: execution counts, success rate, token totals, estimated cost, latency samples and pending confirmations."
    when_to_use:
      - "The user asks how the assistant has been performing, how many runs failed, or how much assistant usage has cost so far."
      - "You need a reliability or usage snapshot to explain past assistant behaviour without reading individual rows."
    when_not_to_use:
      - "To inspect one specific past run's detail — use governance.executions.list."
      - "To predict or budget the cost of a run that has not happened; the values are recorded history only."
    error_contract:
      - "No input arguments, so no argument-validation failures occur."
      - "Verified baseline defect: the registered output contract declares 12 fields while AssistantHealthResponse returns 29 (for example modelCalls, modelTotalTokens, models); the registry rejects undeclared fields, so the call currently fails with an output-contract error (存在未声明的输出字段) instead of returning data."
    cost_hint:
      local: true
      external_dependency: null
      notes: "本次调用只做 JVM 内校验与数据库读写，没有外部依赖。"
    exposure:
      state: pending
      reason: "D3 已核实契约缺陷：AgentToolOutputSchemas.java#L132-L137 登记 HEALTH 共 12 个字段且闭合；AssistantHealthService.summarize L47 返回 AssistantHealthResponse，含 modelCalls/failedModelCalls/modelFailureRate/model*Tokens/unknownPriceCalls/usageEstimatedCost/currency/priceStatus/priceVersion 等约 29 个组件。AgentToolOutputValidator L83-L89 对未声明字段抛“存在未声明的输出字段” → 恒定失败。 在缺陷修复前不进入候选目录。"
    authoritative_facts:
      - fact: totalExecutions
        meaning: "How many assistant executions have been recorded for this caller in total."
      - fact: failedExecutions
        meaning: "How many of those executions ended in failure."
      - fact: successRate
        meaning: "Share of decided executions (succeeded + failed) that succeeded; a summary judgement of assistant reliability."
      - fact: estimatedCost
        meaning: "Summed estimated cost recorded on those executions; an estimate from stored values, not a billed amount."
    examples:
      - name: "overall assistant health"
        input: {}
        expect: "The caller's aggregate health object; in the current baseline the call is rejected by output-contract validation instead (see error_contract)."
    source_provenance:
      registration: backend/src/main/java/com/moxiao/studypilot/agent/tool/AgentReadToolConfiguration.java#L44-L49
      handler: "AssistantHealthService.summarize — bean assistantHealthTool calls service.summarize with the caller identity injected by Java"
      output_schema: backend/src/main/java/com/moxiao/studypilot/agent/tool/AgentToolOutputSchemas.java
    confirmation:
      mode: none
      waiting_status: null
      notes: "只读/导航工具无业务副作用，不产生确认状态；只有写工具经治理链路进入 WAITING_CONFIRMATION 或 WAITING_AUTHORIZATION。"
  - name: learning.context.get
    description: "One-call aggregate of the caller's current learning state: goals, plans, tasks, materials, mastery, a compact projection of the active roadmap, the wrong-question summary, unread notification and pending confirmation counts, registered workspaces, a generatedAt timestamp and human-readable warnings."
    when_to_use:
      - "Starting a conversation or deciding the next study step and you want a single snapshot instead of many round trips."
      - "Checking whether the user has an active roadmap, unread notices or confirmations waiting before proposing work."
    when_not_to_use:
      - "As the source for node-level content such as objectives, difficulty or prerequisites — the embedded roadmap is a compact projection; use roadmap.node.get or roadmap.stage.get."
      - "As the source for settings values — user settings are represented only by a time zone here."
    error_contract:
      - "Does not fail for a fresh account: missing user settings fall back to a default time zone."
      - "The roadmap field is null and warnings carries a note that the user has not joined a roadmap yet; null is a legitimate state, not an error."
      - "The registry caps any tool output at 65,536 bytes; a very large aggregate is replaced by the envelope {warning, originalBytes, truncated} instead of the context object."
    cost_hint:
      local: true
      external_dependency: null
      notes: "本次调用只做 JVM 内校验与数据库读写，没有外部依赖。"
    exposure:
      state: allowed
      reason: "Read-only, caller-scoped aggregate that only composes existing business reads; it is the agent's primary context source and mutates nothing."
    authoritative_facts:
      - fact: generatedAt
        meaning: "When this snapshot was assembled; required to judge how fresh the aggregate is."
      - fact: roadmap
        meaning: "Compact view of the active roadmap (or null when the user has not enrolled); tells the agent whether route-based guidance is possible."
      - fact: pendingConfirmationCount
        meaning: "How many governed actions are waiting for the user's confirmation or authorization."
      - fact: warnings
        meaning: "Human-readable caveats about the state, such as no active roadmap; must be surfaced rather than silently dropped."
    examples:
      - name: "full learning snapshot"
        input: {}
        expect: "Aggregate object with learning collections, roadmap (object or null), wrong-question summary, counts, workspaces and warnings."
    source_provenance:
      registration: backend/src/main/java/com/moxiao/studypilot/agent/tool/AgentReadToolConfiguration.java#L51-L57
      handler: "AgentLearningContextService.get — bean learningContextTool calls service.get with the caller identity injected by Java"
      output_schema: backend/src/main/java/com/moxiao/studypilot/agent/tool/AgentToolOutputSchemas.java
    confirmation:
      mode: none
      waiting_status: null
      notes: "只读/导航工具无业务副作用，不产生确认状态；只有写工具经治理链路进入 WAITING_CONFIRMATION 或 WAITING_AUTHORIZATION。"
  - name: learning.goals.list
    description: "Lists every learning goal owned by the caller, each with its id, title, target date, weekly study hours and lifecycle status."
    when_to_use:
      - "The user asks which goals exist, or wants to pick a goal before a plan is created or adjusted."
      - "You need a goal id for a related question about plans."
    when_not_to_use:
      - "To find out what is scheduled for a day — goals carry no schedule; use learning.tasks.list."
      - "To measure progress — goals carry no completion counters."
    error_contract:
      - "Returns an empty array for an account with no goals; an empty list is a valid answer, not a failure."
      - "Caller scoping is applied in the query, so another user's goals can never appear."
    cost_hint:
      local: true
      external_dependency: null
      notes: "本次调用只做 JVM 内校验与数据库读写，没有外部依赖。"
    exposure:
      state: allowed
      reason: "Read-only caller-scoped query over that caller's own learning goals; no mutation and no cross-user exposure."
    authoritative_facts:
      - fact: id
        meaning: "Stable goal identifier used to link plans and later questions."
      - fact: status
        meaning: "Lifecycle state of the goal (whether it is still active or finished)."
      - fact: targetDate
        meaning: "The date the user committed to for the goal."
      - fact: weeklyStudyHours
        meaning: "The study budget the user set for the goal; the constraint later planning must respect."
    examples:
      - name: "all goals"
        input: {}
        expect: "Array of goal objects (possibly empty)."
