      notes: "只读/导航工具无业务副作用，不产生确认状态；只有写工具经治理链路进入 WAITING_CONFIRMATION 或 WAITING_AUTHORIZATION。"
  - name: roadmap.node.get
    description: "Returns the full knowledge-node blueprint of a node in the caller's active roadmap: objectives, high-frequency points, common mistakes, search keywords, time estimates, difficulty, required flag, prerequisite codes, the per-node status flags, display status and version."
    when_to_use:
      - "The user asks what a node covers, what to watch out for, or how long it should take."
      - "You need prerequisite codes or the node's status flags before recommending it."
    when_not_to_use:
      - "To obtain quiz questions or answers — the node holds no questions; use the assessment tools."
      - "As a progress counter for a whole module or stage; this is a single node."
    error_contract:
      - "ResourceNotFoundException when the caller has no active enrollment (当前路线不存在) or the node is not in the enrolled template (路线节点不存在)."
      - "IllegalStateException when catalog and per-user node state diverge (用户路线节点状态不存在); that indicates a data-integrity problem rather than a bad argument."
    cost_hint:
      local: true
      external_dependency: null
      notes: "本次调用只做 JVM 内校验与数据库读写，没有外部依赖。"
    exposure:
      state: allowed
      reason: "Read-only lookup of catalog content joined with the caller's own node state; it cannot alter progress."
    authoritative_facts:
      - fact: objectives
        meaning: "What the node is meant to teach; the checklist for judging completion."
      - fact: prerequisiteCodes
        meaning: "Node codes that must be passed first; the study-order constraint."
      - fact: quizStatus
        meaning: "Whether the node's quiz is still required, passed or failed; drives retake guidance."
      - fact: displayStatus
        meaning: "The resolved availability and completion status the user should be told."
    examples:
