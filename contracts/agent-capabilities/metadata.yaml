    error_contract:
      - "A failed run is thrown by requireRunnerSuccess as an IllegalStateException carrying stderrSummary, and the action is finalized as FAILED, so a failing run is never returned as success."
      - "A workspace path or fingerprint change surfaces as a conflict and the run is refused until the owner re-previews."
      - "A missing workspaceId or templateType is rejected before execution, and a wrong templateType value fails RunnerTemplateType.valueOf."
      - "LOW descriptor risk with required scope RUNNER_MANAGEMENT yields an action awaiting authorization until granted, and the PREPARE_DEPENDENCIES template additionally arrives as WAITING_CONFIRMATION from the runner level HIGH risk."
