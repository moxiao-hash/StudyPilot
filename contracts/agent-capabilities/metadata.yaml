      - "Params must exactly equal the route required set with no extra and no missing key, and each value must be a string matching the safe-identifier pattern of one leading alphanumeric character followed by up to 127 characters from letters, digits, dot, underscore, colon and hyphen."
    when_not_to_use:
      - "The desired destination is not one of the 28 whitelisted routeKeys, because there is no fallback and the call fails."
