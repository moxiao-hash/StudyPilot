      notes: "只读/导航工具无业务副作用，不产生确认状态；只有写工具经治理链路进入 WAITING_CONFIRMATION 或 WAITING_AUTHORIZATION。"
  - name: roadmap.module.get
    description: "Returns one module of the caller's active roadmap with its counters, display status, the milestone node and every node in the module."
    when_to_use:
      - "The user asks about one module's contents, its milestone or which of its nodes are done."
      - "You need the module's nodes and the milestone that closes it."
    when_not_to_use:
      - "For stage-level roll-ups — use roadmap.stage.get."
