      reason: "H02 shared boundary; local-automation and developer platform tools are disabled until H11."
    confirmation:
      mode: always_user_confirmation
      waiting_status: WAITING_CONFIRMATION
      notes: "HIGH risk requires a dedicated user confirmation, validate only checks the registry and touches no adapter, and duplicate confirmations are absorbed by the action lease."
    authoritative_facts:
      - fact: receiptStatus
        meaning: "The local adapter receipt status, and failures are surfaced as errors instead of a success result."
      - fact: localAdapterInvoked
        meaning: "Whether the local adapter was actually invoked, which is false when the business API path was preferred."
      - fact: targetDigest
        meaning: "Digest of the symbolic target that was used, without exposing a local path."
      - fact: actionKey
        meaning: "The frozen local interface action that was requested."
      - fact: targetKey
        meaning: "The registered symbolic target the action addressed."
    examples:
      - name: "execute a registered fallback action"
        input:
          businessApiAvailable: false
          channel: PLAYWRIGHT_DOM
          actionKey: OPEN_STUDYPILOT_ROUTE
          targetKey: ASSISTANT
        expect: "An action awaiting confirmation first; after confirmation a local interface execution result with channel, actionKey, targetKey, localAdapterInvoked true and receiptStatus, or a deterministic local adapter error when the adapter fails."
      - name: "business API preferred"
        input:
          businessApiAvailable: true
          channel: PLAYWRIGHT_DOM
          actionKey: OPEN_STUDYPILOT_ROUTE
          targetKey: ASSISTANT
