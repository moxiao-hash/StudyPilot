  - name: developer.interface_fallback.execute
    description: "Executes one whitelisted local interface action on the Playwright DOM browser channel or the IDE accessibility channel when no deterministic business API exists. Targets may only come from the Java static registry and the model can never pass a path, URL, selector or free text."
    when_to_use:
      - "The capability catalog confirms no business API exists for a frozen action and the owner asks for the local interface fallback."
      - "A frozen action and target combination, for example opening a named StudyPilot route or focusing the agent input, was previewed with developer.interface_fallback.preview and is to be executed."
    when_not_to_use:
      - "A business API is available, because businessApiAvailable true makes the policy return the BUSINESS_API decision and no local adapter is touched."
      - "The intended target is a path, URL, selector or arbitrary text, because the registry only accepts symbolic keys and fails closed."
      - "The channel and action pair does not match, for example an IDE action requested on the browser channel."
      - "The model wants to open a login page or fill credentials, because credential entry is a user-only action under matrix section 4."
    error_contract:
      - "An unregistered channel, action or targetKey fails closed with an invalid-argument error before any adapter call."
      - "A mismatch between channel and action fails closed with an invalid-argument error."
      - "A failed or rejected adapter receipt is turned into a deterministic error carrying the stable error code, for example LOCAL_ADAPTER_ followed by the status, plus a manual recovery hint, and it is recorded as FAILED, so a failure or rejection receipt is never written as success."
      - "HIGH risk returns WAITING_CONFIRMATION first, and a repeated confirmation does not repeat a side effect."
    cost_hint:
      local: true
      external_dependency: null
      notes: "本次调用只做 JVM 内校验与数据库读写，没有外部依赖。"
    exposure:
